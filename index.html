<style>

<main id="recover" aria-live="polite"><h1>山上優雅</h1><p>正在載入完整三頁與互動導航。</p><div id="status" role="status">檢查原始三頁版本…</div><p id="help">若無網路且尚未完成本機載入，無法執行現場紀錄。請勿以此畫面代替緊急求援。</p><a href="tel:119">緊急狀況：開啟 119 撥號</a></main>
<script>
(async()=>{
 'use strict';
 const SOURCES=["https://raw.githubusercontent.com/whrvxgbd28-arch/tsums-youya/5d29c9c1ad12eba3127c14357dcfb3e189db6ad0/index.html", "https://cdn.jsdelivr.net/gh/whrvxgbd28-arch/tsums-youya@5d29c9c1ad12eba3127c14357dcfb3e189db6ad0/index.html"];
 const PATCH="/* TSUMS 山上優雅 QA-064 | 非破壞式三頁互動與缺口導覽\n   Source target: QA-056 original full 3-page index.html (Git blob 6b9aedb79a48...)\n   Public UI integration only. No Protected Core or hidden decision logic.\n   No database writes, no evidence-status fabrication, no emergency actions.\n*/\n(()=>{\n 'use strict';\n if(window.__TSUMS_QA064__)return;\n const Q='qa064',get=id=>document.getElementById(id);\n const preflight=[\n  {label:'建立行程',page:'p1',focus:'tripName',fields:['tripName','recruitment'],hint:'行程名稱、原始招募資料'},\n  {label:'隊伍與聯絡',page:'p2',focus:'leader',fields:['leader','leaderContact'],hint:'具名帶隊／聯絡方式'},\n  {label:'路線與撤退',page:'p3',focus:'terrain',fields:['terrain','retreatPlan'],hint:'地形風險、撤退方案'},\n  {label:'留守與通訊',page:'p4',focus:'guardianName',fields:['guardianName','guardianPhone','commPrimaryMode'],hint:'留守人、聯絡方式與主通訊'},\n  {label:'出發前核對',page:'p5',focus:'p10aActor',fields:['p10aActor','p10aSite'],hint:'登山口現場核對及具名責任'}\n ];\n const p10Dest={\n  '01': ['p6','runtimeQuickCheckin'], '02':['p6ui','p10locLaunch'],\n  '03':['p6','fieldNote'], '04':['p6','fieldNote'],\n  '05':['p6','teamSnapshotNote'], '06':['p6','runtimeQuickCheckin'],\n  '07':['p6','runtimeCellular'], '08':['p6ui','p10ManualRaw'],\n  '09':['p6','fieldNote'], '10':['p6','decisionChoice'],\n  '11':['p6','capturePhotoButton'], '12':['p6','fieldLocation'],\n  '13':['p6','fieldNote'], '14':['p7','outcomeFacts']\n };\n const p10Special={\n  'Field Session':['p5','p10aActor'],\n  '事件連續性':['p8','exportJson'],\n  '外部交接':['p7','v0641HandoffStatus'],\n  '治理關閉':['p7','closureActor'],\n  '場域封閉':['p6','fieldNote'],\n  '生態／棲地警訊':['p6','fieldNote'],\n  '敏感座標外送':['p11ui','tsumsP11ReviewPrivacy'],\n  '受保護知識':['p11ui','tsumsP11ReviewPrivacy'],\n  '一鍵定位':['p6ui','p10locLaunch'],\n  '氧｜氣體交換':['p6ui','p10ManualRaw'],\n  '溫｜熱平衡':['p6ui','p10ManualRaw'],\n  '血｜循環代謝':['p6ui','p10ManualRaw'],\n  '腦｜神經中樞':['p6ui','p10ManualRaw'],\n  '動｜組織完整性':['p6ui','p10ManualRaw']\n };\n const p11Dest={\n  '01':['p7','accounted'], '02':['p8','exportJson'],\n  '03':['p7','outcomeFacts'], '04':['p8','exportJson'],\n  '05':['p8','v0641ExportMasked'], '06':['p7','v0641HandoffStatus'],\n  '07':['p7','outcomeFacts'], '08':['p7','repairEvidence'],\n  '09':['p7','residualRisk'], '10':['p7','repairOwner'],\n  '11':['p7','p10PrivHoldReason'], '12':['p8','v0641ExportMasked']\n };\n let previous=null,lastFocus=null;\n const style=document.createElement('style');style.id=Q+'-style';style.textContent=`\n .${Q}-tap{cursor:pointer!important;border-radius:9px!important;outline-offset:2px!important;touch-action:manipulation}\n .${Q}-tap:focus-visible,.${Q}-action:focus-visible{outline:3px solid #f7db97!important}\n .${Q}-tap:active,.${Q}-action:active{filter:brightness(1.3)}\n .${Q}-cta,.${Q}-back,.${Q}-action{min-height:44px;padding:10px 13px;border:1px solid #b58d55;background:#322319;color:#ffdda1;border-radius:12px;font:inherit;cursor:pointer}\n .${Q}-cta{display:block;width:100%;margin:12px 0;font-weight:700}\n .${Q}-back{display:inline-block;margin:10px 0}\n .${Q}-badge{font-size:.81rem;color:#e8c58f;font-weight:600;margin:4px 0}\n .${Q}-tip{font-size:.85rem;color:#e3d0ac;line-height:1.5;margin:10px 0}\n .${Q}-panel{background:#19140f;border:1px solid #80603c;border-radius:17px;padding:14px;margin:13px 0;color:#f5e4c8}\n .${Q}-panel h3{margin:4px 0 8px;color:#ffdb9c;font-size:1.1rem}\n .${Q}-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin:8px 0;min-height:58px;padding:12px;border-radius:12px;border:1px solid #7f6243;background:#261d14;color:#ffe2b5;cursor:pointer;font:inherit}\n .${Q}-item .${Q}-right{margin-left:auto;color:#f0bd7d;font-size:.83rem;white-space:nowrap}\n .${Q}-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n .${Q}-focus{outline:3px solid #f8cf80!important;outline-offset:4px;scroll-margin-top:95px}\n #${Q}-toast{position:fixed;left:14px;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:12010;background:#332414;color:#ffe3af;border:1px solid #d5a75e;border-radius:12px;padding:12px;box-shadow:0 8px 25px #000a;font-size:.9rem;line-height:1.5;pointer-events:none}\n #${Q}-toast[hidden]{display:none}\n #${Q}-return{display:none;border-left:4px solid #e8bd76;margin:10px 0;padding:10px;background:#221a13;color:#ffe2ad}\n #${Q}-return .${Q}-action{margin-left:9px}\n .p10uiMeters>span.${Q}-tap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:11px 12px!important}\n .p10uiMeters>span.${Q}-tap::after{content:'›';color:#ffd291;font-size:1.5em}\n @media(max-width:420px){.${Q}-item{padding:10px;font-size:.91rem}}\n `;document.head.appendChild(style);\n const toast=document.createElement('div');toast.id=Q+'-toast';toast.hidden=true;toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');document.body.appendChild(toast);\n function notice(str){toast.textContent=str;toast.hidden=false;clearTimeout(notice.t);notice.t=setTimeout(()=>{toast.hidden=true},3400)}\n function valuePresent(el){if(!el)return false;if(el.type==='checkbox'||el.type==='radio')return el.checked;return String(el.value||'').trim()!==''}\n function inputStatus(fields){const els=fields.map(get).filter(Boolean);if(!els.length)return '待開啟';const ok=els.filter(valuePresent).length;if(ok===0)return '待補';if(ok===els.length)return '速查已填 · 未驗證';return `速查已填 ${ok}/${els.length}`}\n function openAncestors(el){let x=el;while(x){if(x.tagName==='DETAILS')x.open=true;x=x.parentElement}}\n function activePage(){return document.querySelector('.page.active')?.id||'p0'}\n async function gotoPage(page){const target=get(page);if(!target)return false;let did=false;\n  try{if(typeof window.go==='function'){await window.go(page);did=target.classList.contains('active')}}catch(e){console.warn('[QA064] existing navigation failed',e)}\n  if(!did){const btn=document.querySelector(`[data-go=\"${page}\"]`);if(btn){btn.click();did=target.classList.contains('active')}}\n  if(!did){document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el===target));did=true}\n  return did;\n }\n async function jump(page,id,from){const target=get(id),zone=get(page);if(!target||!zone){notice('原頁找不到對應功能，請勿視為已完成。');return false}\n  if(!previous||!previous.hold)previous={page:from||activePage(),focus:lastFocus?.id||null,hold:true};\n  await gotoPage(page);openAncestors(target);let back=get(Q+'-return');if(back){back.style.display='block';if(zone.firstElementChild!==back)zone.insertBefore(back,zone.firstElementChild)}\n  target.scrollIntoView({behavior:'instant',block:'center'});document.querySelectorAll('.'+Q+'-focus').forEach(el=>el.classList.remove(Q+'-focus'));target.classList.add(Q+'-focus');\n  if(target.matches('input,textarea,select')){target.focus({preventScroll:true})}else{target.setAttribute('tabindex',target.getAttribute('tabindex')||'-1');target.focus({preventScroll:true})}\n  notice('已開啟對應位置；填寫不等於保存，請使用原頁的確認／保存按鈕。');return true;\n }\n async function returnBack(){const state=previous;previous=null;if(!state)return;await gotoPage(state.page);const back=get(Q+'-return');if(back)back.style.display='none';notice('已返回上一個檢查區，資料尚需以原頁結果核對。')}\n function makeButton(label,fn,cl=Q+'-cta'){const b=document.createElement('button');b.type='button';b.className=cl;b.textContent=label;b.addEventListener('click',fn);return b}\n const back=document.createElement('div');back.id=Q+'-return';back.append('已開啟指定欄位｜');back.appendChild(makeButton('← 返回原檢查區',returnBack,Q+'-action'));\n function installP9(){const target=get('journeySteps');if(!target)return 0;const panel=document.createElement('details');panel.id=Q+'-p9';panel.className=Q+'-panel';const head=document.createElement('summary');head.textContent='還缺什麼？按這裡直達欄位 ›';head.style.cssText='font-weight:700;color:#ffdb9c;min-height:44px;cursor:pointer;display:flex;align-items:center';panel.appendChild(head);const caption=document.createElement('p');caption.className=Q+'-tip';caption.textContent='僅檢查代表欄位；已填不等於該階段完成或成功保存。';panel.appendChild(caption);\n  for(const p of preflight){const btn=makeButton('',()=>jump(p.page,p.focus,activePage()),Q+'-item');const label=document.createElement('span');label.textContent=p.label;const stat=document.createElement('span');stat.className=Q+'-right';function update(){stat.textContent=inputStatus(p.fields)}update();btn.append(label,stat);btn.title=p.hint;panel.appendChild(btn);document.addEventListener('input',update);document.addEventListener('change',update)}\n  target.insertAdjacentElement('afterend',panel);return preflight.length;\n }\n function installP10(){let count=0;for(let i=1;i<=14;i++){const num=String(i).padStart(2,'0');const mod=get('p10ui-m'+num);if(!mod)continue;const dest=p10Dest[num];if(!dest)continue;\n  const cells=mod.querySelectorAll('.p10uiMeters > span');cells.forEach(cell=>{const clone=cell.cloneNode(true),label=clone.querySelector('b');if(label)label.remove();const txt=clone.textContent.trim();const action=p10Special[txt]||dest;\n    cell.classList.add(Q+'-tap');cell.setAttribute('role','button');cell.setAttribute('tabindex','0');cell.setAttribute('aria-label','前往處理：'+txt);\n    const act=()=>{lastFocus=cell;jump(action[0],action[1],activePage())};cell.addEventListener('click',act);cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});count++;\n  });\n  if(!cells.length){const body=mod.querySelector('.p10uiModuleBody');if(body){body.appendChild(makeButton('前往實際操作 ›',()=>jump(dest[0],dest[1],activePage()))) ;count++}}\n }\n return count;\n }\n function installP11(){let count=0;for(let i=1;i<=12;i++){const num=String(i).padStart(2,'0');const mod=get('p11ui-m'+num);if(!mod)continue;const dest=p11Dest[num];const body=mod.querySelector('.p11Body');if(!body||!dest)continue;\n  const btn=makeButton('前往補充／核對 ›',()=>jump(dest[0],dest[1],activePage()));body.appendChild(btn);count++;\n }return count}\n function installCrossPageCTA(){const p10=get('p6ui'),p11=get('p11ui');if(p10){const hero=p10.querySelector('.p10uiHero')||p10;const panel=document.createElement('div');panel.className=Q+'-panel';const h=document.createElement('h3');h.textContent='當下要做什麼？';panel.appendChild(h);\n  for(const [title,pg,id] of [['記下現場狀況','p6','fieldNote'],['拍照記錄','p6','capturePhotoButton'],['語音速記','p6ui','p10ManualVoice'],['我要 CHECK-IN','p6','runtimeQuickCheckin']]){panel.appendChild(makeButton(title+' ›',()=>jump(pg,id,activePage()),Q+'-item'))}\n  hero.insertAdjacentElement('afterend',panel)}\n  if(p11){const top=p11.querySelector('.p11Hero')||p11.querySelector('h2');if(top){const pnl=document.createElement('div');pnl.className=Q+'-panel';const h=document.createElement('h3');h.textContent='行程後，一鍵找到要處理的事';pnl.appendChild(h);\n   for(const [title,pg,id] of [['檢查結束與交接','p7','accounted'],['產生原有回放摘要','p11ui','tsumsP11OneSummary'],['查看原始紀錄','p8','exportJson'],['檢查個資與保全','p7','p10PrivHoldReason']])pnl.appendChild(makeButton(title+' ›',()=>jump(pg,id,activePage()),Q+'-item'));\n   top.insertAdjacentElement('afterend',pnl)}}}\n function installFeedback(){document.addEventListener('input',e=>{const t=e.target;if(!t.matches('input,textarea,select'))return;const zone=t.closest('.page');if(!zone||!['p1','p2','p3','p4','p5','p6','p7'].includes(zone.id))return;\n  const hint=get(Q+'-editing');if(hint&&hint.parentElement!==zone){zone.prepend(hint)}if(hint){hint.textContent='欄位已編輯，尚待原頁保存與核驗。';hint.hidden=false}\n },{capture:false})}\n function boot(){if(!get('p0')||!get('p6ui')||!get('p11ui')){console.warn('[QA064] Not the full QA-056 3-page DOM; patch not installed');return}\n  const editing=document.createElement('div');editing.id=Q+'-editing';editing.className=Q+'-badge';editing.hidden=true;editing.setAttribute('role','status');editing.setAttribute('aria-live','polite');document.body.appendChild(editing);\n  document.body.appendChild(back);const findings={p9:installP9(),p10:installP10(),p11:installP11()};installCrossPageCTA();installFeedback();\n  window.__TSUMS_QA064__={version:'QA-064',findings,jump,returnBack,preflight:preflight.map(x=>x.label)};\n  console.info('[QA064] UI route-only integration ready',findings)\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n\n/* QA-065 ergonomic display overlay. Public-facing wording only; no state writes. */\n(()=>{const enhance=()=>{\n if(!document.getElementById('p0') || !document.getElementById('p11ui'))return;\n if(document.getElementById('qa065-style'))return;\n const st=document.createElement('style');st.id='qa065-style';st.textContent=`\n #p6ui .p10auditOwner,#p6ui .p10uiModuleMeta,#p6ui .p10uiTags,\n #p6ui .p10uiOver,#p6ui .p10uiBottom,#p11ui .p11Scope,#p11ui .p11Signal{display:none!important}\n #p6ui .p10uiMeters>span[role=button]{min-height:60px!important}\n #p6ui .p10uiModule summary,#p11ui .p11Module summary{min-height:58px!important}\n #qa065-info{font-size:12px;color:#dbc39d;padding:10px;margin:12px 0;border:1px solid #826342;border-radius:10px}\n `;document.head.appendChild(st);\n const host=document.getElementById('p0');if(host){const note=document.createElement('div');note.id='qa065-info';note.textContent='已載入完整三頁與缺項直達。此版本供整合測試；保存、送達與離線使用須各自確認。';host.appendChild(note)}\n};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhance,{once:true});else enhance()})();";
 const STATUS=document.getElementById('status');
 const update=s=>{if(STATUS)STATUS.textContent=s};
 const good=s=>typeof s==='string'&&s.length>1000000&&s.includes('id="p0"')&&s.includes('id="p6ui"')&&s.includes('id="p11ui"')&&s.includes('QA-056')&&s.includes('id="startFieldSession"');
 const CACHE_NAME='tsums-qa065-recovery-app-v1';
 const CACHE_PATH=location.protocol==='https:'?location.origin+location.pathname+'?__qa065_original_immutable':'https://whrvxgbd28-arch.github.io/tsums-youya/?__qa065_original_immutable';
 async function cached(){try{if(!('caches' in self))return null;const c=await caches.open(CACHE_NAME),r=await c.match(CACHE_PATH);if(!r)return null;const t=await r.text();return good(t)?t:null}catch(_){return null}}
 async function remember(s){try{if(!('caches' in self))return;const c=await caches.open(CACHE_NAME);await c.put(CACHE_PATH,new Response(s,{headers:{'Content-Type':'text/html;charset=utf-8'}}))}catch(_){/* cache unavailable: no success claim */}}
 async function fetchBase(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const response=await fetch(url,{mode:'cors',credentials:'omit',redirect:'follow',signal:ctrl.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const text=await response.text();if(!good(text))throw Error('遠端資料不是指定的完整三頁原始版本');return text}finally{clearTimeout(timer)}}
 let original=null;
 try{
  original=await cached();if(original)update('正在從本機程式快取載入完整三頁…');
  if(!original){for(const url of SOURCES){try{update('正在讀取 GitHub 歷史中已確認的 QA-056 完整三頁…');original=await fetchBase(url);break}catch(e){console.warn('[QA065] source not available',e)}}}
  if(!original)throw Error('無法取得 QA-056 原始三頁；請確認網路，或待復原後重新開啟。');
  if(!original.includes('id="p6ui"')||!original.includes('id="p11ui"'))throw Error('原頁結構核對失敗，停止載入。');
  update('版本核對完成，正在接入三頁跳轉…');
  const extra='<script>\n'+PATCH.replace(/<\/script/gi,'<\/script')+'\n<\/script>';
  if(!/<\/body\s*>/i.test(original))throw Error('原始頁面缺少結束標記，停止載入。');
  const merged=original.replace(/<\/body\s*>/i,extra+'\n</body>');
  /* Only code is cached, never evidence or health information. */
  await remember(original);
  window.__TSUMS_QA065_LOAD_INFO__={sourceCommit:'5d29c9c1',baseline:'QA-056',overlay:'QA-064',mode:'remote-immutable-baseline-with-cache'};
  document.open();document.write(merged);document.close();
 }catch(err){update('載入失敗：'+err.message+'。未進行任何資料庫修改。');const help=document.getElementById('help');if(help){help.textContent='這是線上復原候選檔，不是已驗收的離線山域正式系統。保留本機資料，不要清除 Safari 網站資料。';}console.error('[QA065]',err)}
})();
</script>
